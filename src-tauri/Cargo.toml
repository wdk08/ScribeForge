[package]
name = "storyforge"
version = "1.0.0"
description = "StoryForge local prose editor"
authors = ["Forge Studios"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.90"

[lib]
name = "storyforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

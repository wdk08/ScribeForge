[package]
name = "scribeforge"
version = "1.0.1"
description = "ScribeForge local prose editor"
authors = ["Forge Studios"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.90"

[lib]
name = "scribeforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
base64 = "0.22"

[profile.release]
lto = "thin"
strip = true
